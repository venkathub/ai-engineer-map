name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  curriculum-and-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curriculum
        run: python3 scripts/validate_curriculum.py
      - name: Run labs
        run: python3 -m unittest discover -s tests -v
