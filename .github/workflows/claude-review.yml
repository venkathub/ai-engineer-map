name: Claude PR Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Review pull request with Claude API
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/claude_api_review.py --output claude-review.md

      - name: Publish current Claude review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("<!-- claude-pr-review -->")) | .id' | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --method PATCH -F body=@claude-review.md >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@claude-review.md >/dev/null
          fi
          cat claude-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Claude approval
        if: always()
        env:
          APPROVED: ${{ steps.gate.outputs.approved }}
        run: |
          if [ "$APPROVED" != "true" ]; then
            echo "Claude review has not approved this revision." >&2
            exit 1
          fi
